seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 8000
empirical_normalization: null
obs_groups:
  policy:
  - policy
  critic:
  - policy
  - critic
clip_actions: null
save_interval: 100
experiment_name: biped12_stage4
run_name: s9d
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: true
load_run: 2026-09-18_02-52-27_s9c3
load_checkpoint: model_155500.pt
class_name: OnPolicyRunner
policy:
  class_name: ActorCritic
  init_noise_std: 1.0
  noise_std_type: log
  state_dependent_std: false
  actor_obs_normalization: false
  critic_obs_normalization: false
  actor_hidden_dims:
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.008
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg:
    use_data_augmentation: false
    use_mirror_loss: true
    data_augmentation_func: rl_walking.symmetry:mirror_biped12
    mirror_loss_coeff: 0.5
